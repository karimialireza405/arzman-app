name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  bundle:
    name: Bundle export (Android and web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    env:
      # The app only reads this at runtime; any URL lets the bundle build.
      EXPO_PUBLIC_API_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export
        working-directory: apps/mobile
        run: |
          npx expo export --platform android --output-dir "$RUNNER_TEMP/android"
          npx expo export --platform web --output-dir "$RUNNER_TEMP/web"
